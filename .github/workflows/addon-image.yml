# Builds the Home Assistant add-on image per arch and pushes it to GHCR as the `image:` in
# haos/addon/config.yaml names it: ghcr.io/<owner>/{arch}-addon-<repo>:<version> (and :latest).
# Bump `version:` to release. In a repo made from the template, template-init.yml names the app first;
# until then the image still points at the template's account and this workflow skips.
name: addon-image
on:
  push:
    branches: [main]
    paths:
      - "pb_migrations/**"
      - "pb_hooks/**"
      - "frontend/dist/**"
      - "haos/**"
      - ".github/workflows/addon-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          image=$(yq -r .image haos/addon/config.yaml)
          owner=$(echo "$image" | cut -d/ -f2)
          if [ "$owner" != "$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::notice::image $image belongs to another account — run template-init (names this app) first"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$(yq -r .version haos/addon/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=${image/\{arch\}/${{ matrix.arch }}}" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.v.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: haos/addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          push: true
          provenance: false
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
