# Builds the Home Assistant add-on image per arch and pushes it to GHCR as
#   ghcr.io/laris-co/{arch}-addon-message-relay-v3:<config.yaml version>   (and :latest)
# which is what haos/message_relay_v3/config.yaml `image:` names. Bump `version:` to release.
name: addon-image
on:
  push:
    branches: [main]
    paths:
      - "pb_migrations/**"
      - "pb_hooks/**"
      - "frontend/dist/**"
      - "haos/**"
      - ".github/workflows/addon-image.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(yq -r .version haos/message_relay_v3/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: haos/message_relay_v3/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          push: true
          provenance: false
          tags: |
            ghcr.io/laris-co/${{ matrix.arch }}-addon-message-relay-v3:${{ steps.v.outputs.version }}
            ghcr.io/laris-co/${{ matrix.arch }}-addon-message-relay-v3:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
