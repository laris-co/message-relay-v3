name: "Message Relay v3"
description: >-
  Simple message relay on PocketBase: LINE / GitHub / generic webhooks into one
  messages collection, shown as a live timeline. PocketBase (migrations +
  JS hooks + React UI), stock binary, no custom build; data in /data.
slug: "message_relay_v3"
version: "0.1.12"
url: "https://github.com/laris-co/message-relay-v3"
# Prebuilt by .github/workflows/addon-image.yml ({arch} is substituted by Supervisor).
# Supervisor pulls anonymously: the package must be public, or the registry added with
# `ha docker registries add ghcr.io` (a PAT with read:packages). See README "Home Assistant".
image: "ghcr.io/laris-co/{arch}-addon-message-relay-v3"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# The HA base image runs s6-overlay as PID 1.
init: false
hassio_api: false
homeassistant_api: true  # a notification in HA when a new UI release is out
# Sidebar panel through ingress (the UI uses relative URLs, so it works under the ingress prefix).
# The port stays published: LINE / GitHub must reach /w/. 8789, beside v1's 8787 and v2's 8788.
ingress: true
ingress_port: 8789
panel_icon: mdi:message-text-clock
panel_title: Relay v3
ports:
  8789/tcp: 8789
ports_description:
  8789/tcp: "Webhooks (/w/...), API and timeline"
watchdog: "http://[HOST]:[PORT:8789]/api/health"
# /data is the only path kept across updates and included in HA backups: pb_data lives there.
map:
  - data:rw
options:
  admin_email: ""
  admin_password: ""
  auto_login: true
  ha_user_ids: ""
  public_url: ""
  line_channels: []
  github_secret: ""
  generic_token: ""
  s3_endpoint: ""
  s3_bucket: "message-relay-v3"
  s3_access_key: ""
  s3_secret: ""
  ui_version: "latest"
schema:
  # The PocketBase superuser, created/updated at every start. Set both before the first start.
  admin_email: "str?"
  admin_password: "password?"
  # Signed in to HA -> signed in to the relay (as admin_email) when you open its sidebar panel.
  # Believed only from Supervisor's ingress proxy (172.30.32.2), never from the published port.
  auto_login: bool
  # Optional: comma-separated HA user ids allowed to auto-login (empty: any HA admin the panel lets in).
  ha_user_ids: "str?"
  # Where senders reach this add-on (e.g. https://relay.example.com): the base of the webhook URLs
  # the Endpoints page shows. Sets PocketBase's Application URL at every start.
  public_url: "str?"
  # One entry per LINE bot: its webhook is /w/line/<endpoint>, checked with that channel's secret.
  line_channels:
    - endpoint: "match(^[a-z0-9][a-z0-9_-]{0,63}$)"
      secret: password
  # GitHub webhooks: /w/github/<any endpoint>, X-Hub-Signature-256 with this secret.
  github_secret: "password?"
  # Generic senders: /w/generic/<any endpoint>, Authorization: Bearer <token>.
  generic_token: "password?"
  # Optional S3 (e.g. the RustFS add-on: http://local-rustfs:9000) for PocketBase file storage (bucket)
  # and nightly backups (bucket "<s3_bucket>-backups"; create both). Empty endpoint: local /data only (HA backups still include it).
  s3_endpoint: "str?"
  s3_bucket: "str?"
  s3_access_key: "str?"
  s3_secret: "password?"
  # The UI build to load at start, from laris-co/message-relay-v3-ui releases: "latest", a tag
  # ("v0.2.0"), a full URL of a dist.zip, or "bundled" (the one in this image). Restart to apply.
  ui_version: "str?"
